<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><title>Torneos Virtuales</title>
<style>
:root{--bg:#0b1220;--card:#141d33;--line:#25314f;--tx:#e8edf8;--mu:#8e9bb8;--a:#3b82f6;--b:#f59e0b;--ok:#22c55e;--bad:#ef4444}
@media(prefers-color-scheme:light){:root{--bg:#f3f5fa;--card:#fff;--line:#dde3f0;--tx:#111a2e;--mu:#5b6785}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:auto;padding:12px}h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
button,select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
button{cursor:pointer;background:var(--a);border:0;color:#fff;font-weight:600}button.g{background:var(--card);border:1px solid var(--line);color:var(--tx)}button.r{background:var(--bad)}
.hero{width:100%;font-size:17px;padding:16px;background:linear-gradient(135deg,#22c55e,#3b82f6)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.A{color:var(--a)}.B{color:var(--b)}.dotA,.dotB{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--a)}.dotB{background:var(--b)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}td:nth-child(2),th:nth-child(2){text-align:left}tr.q td{background:rgba(34,197,94,.12)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:12px;font-weight:500}nav button.on{color:var(--ok)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;cursor:pointer}.m b{font-size:20px}.m .t{text-align:right}.m .u{text-align:left}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line)}.ok{background:var(--ok);color:#052}.warn{color:var(--b);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
dialog{width:min(94vw,520px);background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:14px}dialog::backdrop{background:#0009}
input.n{width:56px;text-align:center;font-size:20px}.in{width:100%}.pill{background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:99px;font-size:12px}
</style></head><body><main id="app"></main><nav id="nav"></nav><dialog id="dlg"></dialog><script type="module" src="app.js"></script></body></html>
